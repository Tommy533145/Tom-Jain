name: Godot validation and exports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Import project and validate scripts
        run: godot --headless --editor --path godot --quit

      - name: Run project headlessly
        run: timeout 20s godot --headless --path godot --quit-after 5

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Prepare export directories
        run: mkdir -p dist/windows dist/web

      - name: Export Windows desktop build
        run: godot --headless --path godot --export-release "Windows Desktop" ../dist/windows/TomAndJain.exe

      - name: Export browser build
        run: godot --headless --path godot --export-release "Web" ../dist/web/index.html

      - name: Upload Windows and Web builds
        uses: actions/upload-artifact@v4
        with:
          name: Tom-Jain-Windows-and-Web
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-full-stack-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Python server and embedded Godot Web client
        run: docker build --tag two-keys-online .
